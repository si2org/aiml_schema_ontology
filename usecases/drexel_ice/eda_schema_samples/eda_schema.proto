syntax = "proto3";
package edaschema;

message Empty {}

// Edge Entity
message EdgeEntity {
    string source = 1; // ID of the source node
    string target = 2; // ID of the target node
}

// Standard Cell Entity
message StandardCellEntity {
    string name = 1;
    float width = 2;
    float height = 3;
    int32 no_of_input_pins = 4;
    int32 no_of_output_pins = 5;
    bool is_sequential = 6;
    bool is_inverter = 7;
    bool is_buffer = 8;
    float drive_strength = 9;
    float input_capacitance_min = 10;
    float input_capacitance_max = 11;
    float output_capacitance_min = 12;
    float output_capacitance_max = 13;
    float leakage_power_min = 14;
    float leakage_power_max = 15;
}

// Gate Entity
message GateEntity {
    string name = 1;
    StandardCellEntity standard_cell = 2;
    float llx = 3;
    float lly = 4;
    float urx = 5;
    float ury = 6;
    bool is_sequential = 7;
    bool is_filler = 8;
    bool is_inverter = 9;
    bool is_buffer = 10;
    bool is_diode = 11;
    int32 no_of_fanins = 12;
    int32 no_of_fanouts = 13;
}

// Macro Entity
message MacroEntity {
    string name = 1;
    string libcell_name = 2;
    float llx = 3;
    float lly = 4;
    float urx = 5;
    float ury = 6;
    float internal_power = 7;
    float leakage_power = 8;
    float switching_power = 9;
    int32 no_of_inputs = 10;
    int32 no_of_outputs = 11;
}

// Port Entity
message PortEntity {
    string name = 1;
    string direction = 2;
    float x = 3;
    float y = 4;
    float load_capacitance = 5;
}

// Wire Entity
message WireEntity {
    string name = 1;
    float length = 2;
    string metal_layer = 22;
    float x1 = 3;
    float y1 = 4;
    float x2 = 5;
    float y2 = 6;
    float midpoint_x = 7;
    float midpoint_y = 8;
    float rudy = 9;
    float resistance = 10;
    float capacitance = 11;
}

// Net Entity
message NetEntity {
    string name = 1;
    bool is_special_net = 2;
    int32 no_of_fanouts = 3;
    float x_min = 4;
    float y_min = 5;
    float x_max = 6;
    float y_max = 7;
    float length = 8;
    float hpwl = 9;
    float rudy = 10;
    float resistance = 11;
    float capacitance = 12;
    float total_coupling_capacitance = 13;

    repeated WireEntity wires = 14;
    repeated EdgeEntity edges = 15;
}

// Pin Entity
message PinEntity {
    string pin_name = 1;
    string type = 2;
    string direction = 3;
    bool is_in_clk = 4;
    bool is_startpoint = 5;
    bool is_endpoint = 6;
    string cell_name = 7;
    string net_name = 8;

    float setup_rise_slew = 9;
    float setup_fall_slew = 10;
    float hold_rise_slew = 11;
    float hold_fall_slew = 12;

    float setup_rise_slack = 13;
    float setup_fall_slack = 14;
    float hold_rise_slack = 15;
    float hold_fall_slack = 16;

    float setup_rise_arrival = 17;
    float setup_fall_arrival = 18;
    float hold_rise_arrival = 19;
    float hold_fall_arrival = 20;

    float load_capacitance = 21;
    float ir_drop = 22;
    float switching_activity = 23;
}


// Timing Path Node Entity
message TimingPathNodeEntity {
    string name = 1;
    string gate = 2;
    string standard_cell = 3;
    string pin = 4;
    float cell_delay = 5;
    float arrival_time = 6;
    float slew = 7;
    bool is_rise_transition = 8;
    bool is_fall_transition = 9;
    int32 node_depth = 10;
}

// Timing Graph Entity
message TimingGraphEntity {
    repeated PinEntity pins = 1;
    repeated EdgeEntity edges = 2;
}


// Timing Path Graph Entity
message TimingPathEntity {
    string startpoint = 1;
    string endpoint = 2;
    string path_type = 3;
    float arrival_time = 4;
    float required_time = 5;
    float slack = 6;
    int32 no_of_gates = 7;
    bool is_critical_path = 8;

    repeated PinEntity pins = 9;
    repeated EdgeEntity edges = 10;
}

// Cell Metrics Entity
message CellMetricsEntity {
    int32 no_of_combinational_cells = 1;
    int32 no_of_sequential_cells = 2;
    int32 no_of_buffers = 3;
    int32 no_of_inverters = 4;
    int32 no_of_fillers = 5;
    int32 no_of_tap_cells = 6;
    int32 no_of_diodes = 7;
    int32 no_of_macros = 8;
    int32 no_of_total_cells = 9;
}

// Area Metrics Entity
message AreaMetricsEntity {
    float combinational_cell_area = 1;
    float sequential_cell_area = 2;
    float buffer_area = 3;
    float inverter_area = 4;
    float filler_area = 5;
    float tap_cell_area = 6;
    float diode_area = 7;
    float macro_area = 8;
    float cell_area = 9;
    float total_area = 10;
}

// Power Metrics Entity
message PowerMetricsEntity {
    float combinational_power = 1;
    float sequential_power = 2;
    float macro_power = 3;
    float internal_power = 4;
    float switching_power = 5;
    float leakage_power = 6;
    float total_power = 7;
}

// Timing Metrics Entity
message TimingMetricsEntity {
    float total_negative_slack = 1;
    float worst_slack = 2;
    float critical_path_arrival_time = 3;
    float critical_path_required_time = 4;
    string critical_path_startpoint = 5;
    string critical_path_endpoint = 6;
    int32 no_of_violating_endpoints = 7;
}

// Clock Tree Entity
message ClockTreeEntity {
    string clock_source = 1;
    int32 no_of_buffers = 2;
    int32 no_of_clock_sinks = 3;

    repeated PortEntity ports = 4;
    repeated GateEntity gates = 5;
    repeated NetEntity nets = 6;
    repeated EdgeEntity edges = 7;
}

// Netlist Graph Entity
message NetlistEntity {
    float width = 1;
    float height = 2;
    int32 no_of_inputs = 3;
    int32 no_of_outputs = 4;
    int32 no_of_cells = 5;
    int32 no_of_nets = 6;
    float utilization = 7;
    

    TimingGraphEntity timing_graph = 15;
    repeated TimingPathEntity timing_paths = 151;
    repeated ClockTreeEntity clock_trees = 16;

    repeated PortEntity ports = 17;
    repeated GateEntity gates = 18;
    repeated MacroEntity macros = 19;
    repeated NetEntity nets = 20;
    repeated PinEntity pins = 21;
    repeated EdgeEntity edges = 22;
}

message ConstraintsEntity {
    int32 clock_count = 1;
    float input_delay = 2;
    float output_delay = 3;
    float max_transition = 4;
    float max_fanout = 5;
    float max_capacitance = 6;
}

message StageEntity {
    string name = 1;
    NetlistEntity netlist = 2;

    CellMetricsEntity cell_metrics = 3;
    AreaMetricsEntity area_metrics = 4;
    PowerMetricsEntity power_metrics = 5;
    TimingMetricsEntity timing_metrics = 6;
}

message FlowEntity {
    string name = 1;
    string version = 2;
    string date = 3;
    string design_type = 4;
    ConstraintsEntity constraints = 5;
    repeated StageEntity stage = 6;
}

